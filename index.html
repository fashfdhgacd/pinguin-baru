<!DOCTYPE html>

    <script>
    (function () {
      var m = location.pathname.match(/^\/v\/([^\/?#]+)/);
      if (m && !(location.hash || "").match(/^#\/v\//)) {
        location.replace("/#/v/" + decodeURIComponent(m[1]));
      }
    })();
  </script>
